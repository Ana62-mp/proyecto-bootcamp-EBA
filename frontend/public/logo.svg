<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BBCFD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3BBCFD" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Top Blue Shield Outline -->
  <path d="M 85 80 L 415 80 C 425 80 435 90 435 105 L 420 220 C 410 280 350 340 250 380 C 150 340 90 280 80 220 L 65 105 C 65 90 75 80 85 80 Z" 
        fill="none" stroke="#3BBCFD" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Soap Bubbles / Foam Clouds behind the car -->
  <g fill="#3BBCFD" opacity="0.95">
    <circle cx="150" cy="155" r="28"/>
    <circle cx="185" cy="140" r="32"/>
    <circle cx="230" cy="148" r="26"/>
    <circle cx="270" cy="135" r="36"/>
    <circle cx="315" cy="142" r="30"/>
    <circle cx="355" cy="160" r="24"/>
    <circle cx="205" cy="165" r="20"/>
    <circle cx="295" cy="160" r="22"/>
  </g>

  <!-- Highlight details in foam -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="178" cy="132" r="7"/>
    <circle cx="265" cy="125" r="8"/>
    <circle cx="310" cy="135" r="6"/>
  </g>

  <!-- Car Silhouette: Modern White SUV -->
  <!-- Main white car body -->
  <path d="M 60 215 
           L 95 168 C 100 162 108 160 115 160 
           L 295 160 C 310 160 340 175 365 200 
           L 445 220 C 455 223 458 232 452 240 
           L 440 248 
           L 428 244 
           L 422 258 
           C 418 268 395 272 385 258 
           C 375 245 350 245 340 258 
           C 330 272 305 272 295 260 
           L 185 260 
           C 175 272 150 272 140 258 
           C 130 245 105 245 95 258 
           L 60 258 
           C 54 258 50 250 52 244 
           L 60 215 Z" 
        fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- SUV Roof, Pillars & Windows (Dark Navy Tint) -->
  <!-- Front windshield & front window -->
  <path d="M 245 170 L 305 170 C 315 170 332 182 345 200 L 245 200 Z" fill="#042544"/>
  <!-- Middle & Rear windows -->
  <path d="M 175 170 L 235 170 L 235 200 L 160 200 Z" fill="#042544"/>
  <path d="M 112 172 L 165 172 L 150 200 L 88 200 Z" fill="#042544"/>

  <!-- Car body lines, wheel arches, and accents -->
  <path d="M 52 244 L 92 244 C 102 232 128 232 138 244 L 298 244 C 308 232 334 232 344 244 L 435 244" 
        fill="none" stroke="#042544" stroke-width="6" stroke-linecap="round"/>
  <!-- Side accent crease -->
  <path d="M 75 215 L 180 215 C 240 215 320 225 435 228" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <!-- Wheel arch shadows -->
  <path d="M 98 260 C 102 245 125 245 132 260" fill="none" stroke="#042544" stroke-width="10"/>
  <path d="M 342 260 C 346 245 369 245 376 260" fill="none" stroke="#042544" stroke-width="10"/>

  <!-- Main Wordmark: CARWASH (Solid White Bold Modern Typography) -->
  <text x="250" y="325" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Plus Jakarta Sans', sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#FFFFFF">
    CARWASH
  </text>

  <!-- Slogan: EXCELLENT AUTO WASHING AND DETAILING -->
  <text x="250" y="352" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#FFFFFF" 
        opacity="0.95">
    EXCELLENT AUTO WASHING AND DETAILING
  </text>

  <!-- Bottom Crest Chevron Tip -->
  <path d="M 120 380 L 195 385 L 250 435 L 305 385 L 380 380" 
        fill="none" stroke="#3BBCFD" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
